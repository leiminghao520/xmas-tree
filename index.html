<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>耿鑫源，圣诞快乐 · Merry Christmas</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #01020a; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  .overlay { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; }
  .name {
    bottom: calc(6vh + clamp(50px, 8vw, 96px) + env(safe-area-inset-bottom));
    font: 600 clamp(22px, 4vw, 40px)/1.2 "Kaiti SC", "STKaiti", "PingFang SC", serif; letter-spacing: 4px;
    color: #fff4d6; text-shadow: 0 0 10px #ff6b8a, 0 0 24px #ffb347;
    animation: glow 2.4s ease-in-out infinite alternate;
  }
  .title {
    bottom: calc(6vh + env(safe-area-inset-bottom));
    font-family: "Snell Roundhand", "Brush Script MT", cursive; font-size: clamp(36px, 7vw, 80px);
    color: #ffe9a8; text-shadow: 0 0 12px #ffb347, 0 0 32px #ff4d6d;
    animation: glow 2.4s ease-in-out infinite alternate;
  }
  .sub {
    bottom: calc(2.5vh + env(safe-area-inset-bottom));
    font: 13px/1.4 -apple-system, "PingFang SC", sans-serif; color: rgba(255,255,255,.5); letter-spacing: 2px;
  }
  .mode {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 14px; padding: 8px 14px;
    border: 1px solid rgba(255,233,168,.5); border-radius: 18px; background: rgba(0,0,0,.35);
    color: #ffe9a8; font: 14px -apple-system, "PingFang SC", sans-serif; cursor: pointer;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffe9a8; font: 16px -apple-system, "PingFang SC", sans-serif; letter-spacing: 2px;
    transition: opacity .8s;
  }
  @keyframes glow { from { opacity: .75; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="loading">圣诞树正在点亮…</div>
<div class="overlay name">To 耿鑫源</div>
<div class="overlay title">Merry Christmas</div>
<div class="overlay sub">点一下放烟花 · 拖动旋转 · 双指或滚轮缩放</div>
<button class="mode" id="modeBtn">灯光：闪烁</button>

<script>
  // 依赖从网上加载，网络不通时给出提示
  setTimeout(() => {
    if (!window.__treeReady) document.getElementById('loading').textContent = '加载失败，请换用最新版 Chrome 或 Safari 打开';
  }, 15000);
</script>

<script>
// 2D 兜底版本：浏览器无法创建 WebGL（例如关闭了图形加速）时使用
function start2D() {
// 画布与尺寸
const cv = document.createElement('canvas'); cv.id = 'c'; document.body.prepend(cv);
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const LEAF = ['#1f7a3a', '#2e9e4f', '#17603a', '#3cb371', '#22804a'];
const PALETTE = ['#ff3b5c', '#ffd23f', '#3bff8f', '#3bc8ff', '#c77dff', '#ff8c42', '#ffffff'];

// 树的粒子：螺旋灯带 + 随机填充的枝叶点
const tree = [];
const SMALL = Math.min(innerWidth, innerHeight) < 600;
const TURNS = 7, SPIRAL_N = SMALL ? 340 : 520;
for (let s = 0; s < 2; s++) {
  for (let i = 0; i < SPIRAL_N; i++) {
    const t = i / SPIRAL_N;                 // 0 顶部 → 1 底部
    const ang = t * TURNS * Math.PI * 2 + s * Math.PI;
    const r = t * 1.0;
    tree.push({ y: t, ang, r, kind: 'light', color: PALETTE[(i + s * 3) % PALETTE.length], phase: rand(0, 6.28), size: rand(1.6, 2.6) });
  }
}
for (let i = 0; i < (SMALL ? 800 : 1400); i++) {
  const t = Math.pow(Math.random(), 0.8);
  tree.push({ y: t, ang: rand(0, Math.PI * 2), r: t * Math.sqrt(Math.random()), kind: 'leaf',
    color: LEAF[i % LEAF.length], phase: rand(0, 6.28), size: rand(0.8, 1.8) });
}
// 挂件（大一点的彩球）
for (let i = 0; i < 46; i++) {
  const t = rand(0.12, 0.95);
  tree.push({ y: t, ang: rand(0, Math.PI * 2), r: t * rand(0.85, 1.0), kind: 'ball',
    color: PALETTE[i % 6], phase: rand(0, 6.28), size: rand(3.5, 5.5) });
}

// 雪花
const snow = Array.from({ length: SMALL ? 120 : 220 }, () => ({ x: rand(0, 1), y: rand(0, 1), r: rand(0.6, 2.6), v: rand(0.0006, 0.002), w: rand(0, 6.28) }));
// 烟花粒子
const sparks = [];
function firework(x, y) {
  if (sparks.length > 600) return;
  const hue = rand(0, 360), n = 90;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, sp = rand(1.5, 5);
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: `hsl(${hue + rand(-20, 20)},100%,65%)` });
  }
}

// 交互：拖动旋转、点击烟花、空格切换灯光模式
let rot = 0, rotV = 0.006, dragging = false, lastX = 0, moved = 0, mode = 0;
cv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; moved = 0; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
  rot += dx * 0.01; rotV = dx * 0.002;
});
addEventListener('pointerup', e => {
  if (dragging && moved < 5) firework(e.clientX, e.clientY);
  dragging = false;
});
const MODE_NAMES = ['闪烁', '流水', '彩虹'];
const modeBtn = document.getElementById('modeBtn');
function nextMode() { mode = (mode + 1) % 3; modeBtn.textContent = '灯光：' + MODE_NAMES[mode]; }
modeBtn.addEventListener('click', nextMode);
addEventListener('keydown', e => { if (e.code === 'Space') { nextMode(); e.preventDefault(); } });

// 定时自动放烟花
setInterval(() => firework(rand(W * 0.1, W * 0.9), rand(H * 0.1, H * 0.4)), 2600);

// 预渲染光晕贴图：每种颜色只画一次，之后每帧直接贴图，避免逐点 shadowBlur
const spriteCache = new Map();
function sprite(color, glow) {
  const key = color + glow;
  let c = spriteCache.get(key);
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  if (glow) {
    grad.addColorStop(0, '#fff'); grad.addColorStop(0.12, color);
    grad.addColorStop(0.35, color + '66'); grad.addColorStop(1, color + '00');
  } else {
    grad.addColorStop(0, color); grad.addColorStop(0.5, color); grad.addColorStop(1, color + '00');
  }
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  spriteCache.set(key, c);
  return c;
}
// 彩虹模式按 10° 色相量化，复用贴图
const HUES = Array.from({ length: 36 }, (_, i) => {
  const c = document.createElement('canvas').getContext('2d');
  c.fillStyle = `hsl(${i * 10},100%,60%)`; return c.fillStyle;
});

function drawStar(x, y, R, time) {
  const pulse = 1 + Math.sin(time * 3) * 0.08;
  const g = ctx.createRadialGradient(x, y, 0, x, y, R * 4);
  g.addColorStop(0, 'rgba(255,230,120,.9)'); g.addColorStop(1, 'rgba(255,200,50,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * 4, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(time * 0.6); ctx.scale(pulse, pulse);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? R * 0.42 : R, a = i * Math.PI / 5 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = '#ffe066'; ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 25; ctx.fill();
  ctx.restore();
}

function frame(ms) {
  const time = ms / 1000;
  // 拖尾效果
  ctx.fillStyle = 'rgba(2,3,10,0.35)';
  ctx.fillRect(0, 0, W, H);

  if (!dragging) { rot += rotV; rotV += (0.006 - rotV) * 0.02; }

  const size = Math.min(W, H);
  const portrait = H > W * 1.2;
  const cx = W / 2, top = H * (portrait ? 0.16 : 0.12), treeH = portrait ? H * 0.5 : size * 0.55, treeR = size * (portrait ? 0.3 : 0.27);

  // 叠加混合与绘制顺序无关，因此不需要按深度排序
  ctx.globalCompositeOperation = 'lighter';
  const k = treeR * 1.6;
  for (let i = 0; i < tree.length; i++) {
    const p = tree[i];
    const a = p.ang + rot, z = Math.sin(a) * p.r;
    const persp = 1 / (1.6 - z * 0.45);
    const sx = cx + Math.cos(a) * p.r * k * persp, sy = top + p.y * treeH;
    const depth = (z + 1) / 2;                     // 0 后 → 1 前
    let alpha = 0.25 + depth * 0.75, s = p.size * (0.6 + depth * 0.7), img;
    if (p.kind === 'light') {
      let tw, color = p.color;
      if (mode === 0) tw = 0.5 + 0.5 * Math.sin(time * 4 + p.phase);              // 闪烁
      else if (mode === 1) tw = 0.5 + 0.5 * Math.sin(time * 5 - p.y * 25);        // 流水
      else { tw = 1; color = HUES[((time * 80 + p.y * 360) / 10 | 0) % 36]; }     // 彩虹
      alpha *= 0.35 + tw * 0.65; s *= (0.8 + tw * 0.5) * 3.2;
      img = sprite(color, true);
    } else if (p.kind === 'ball') {
      alpha *= 0.8 + 0.2 * Math.sin(time * 2 + p.phase); s *= 3;
      img = sprite(p.color, true);
    } else {
      alpha *= 0.55; s *= 1.6;
      img = sprite(p.color, false);
    }
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, sx - s, sy - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;

  // 树干
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#5a3418';
  ctx.fillRect(cx - size * 0.025, top + treeH + 4, size * 0.05, size * 0.06);

  drawStar(cx, top - 6, size * 0.035, time);

  // 雪花
  ctx.fillStyle = '#fff';
  for (const f of snow) {
    f.y += f.v; f.w += 0.01; f.x += Math.sin(f.w) * 0.0004;
    if (f.y > 1) { f.y = -0.02; f.x = rand(0, 1); }
    ctx.globalAlpha = 0.4 + f.r / 4;
    ctx.fillRect(f.x * W - f.r / 2, f.y * H - f.r / 2, f.r, f.r);
  }

  // 烟花
  ctx.globalCompositeOperation = 'lighter';
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.vx *= 0.985; s.vy *= 0.985; s.life -= 0.012;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.globalAlpha = s.life; ctx.fillStyle = s.color;
    ctx.fillRect(s.x - 1.2, s.y - 1.2, 2.4, 2.4);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

}
